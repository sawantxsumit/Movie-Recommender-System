<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Recommendation System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <main class="main">
      <h1 class="main-heading">Movie Recommendation System</h1>

      <section class="search-card">
        
        <div class="field-group">
          <label for="movie-input">Search a movie</label>
          <input
            id="movie-input"
            type="text"
            placeholder="e.g. The Dark Knight"
            class="text-input"
            list="movies"
          />
          <datalist id="movies"></datalist>
        </div>

        <div class="field-group number-group">
          <label for="movie-count">Number of recommendations</label>
          <div class="number-control">
            <button id="decrease" type="button" class="counter-btn">−</button>
            <input
              id="movie-count"
              type="number"
              min="1"
              max="10"
              value="5"
              step="1"
              class="number-input"
              readonly
            />
            <button id="increase" type="button" class="counter-btn">+</button>
          </div>
        </div>

        <button id="recommend" class="btn-primary" type="button">
          Recommend
        </button>
        
      </section>

  <section class="recommendations" id="recommendations">
  <h2 class="reco-title">
    Recommendations for <span id="reco-movie">movie</span>
  </h2>

  <!-- grid container for cards -->
  <div class="cards-grid" id="cards-grid"></div>
  </section>

  <div id="movie-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      
      <div class="modal-body">
        <div class="modal-poster">
          <img id="modal-img" src="" alt="Movie Poster">
        </div>
        
        <div class="modal-info">
          <h2 id="modal-title">Movie Title</h2>
          
          <div class="modal-meta">
            <span id="modal-rating" class="meta-badge star">★ 0.0</span>
            <span id="modal-date" class="meta-badge">Year</span>
            <span id="modal-runtime" class="meta-badge">0h 00m</span>
          </div>
          
          <p id="modal-genres" class="meta-genres">Genres</p>

          <hr class="modal-divider">

          <h3 class="modal-overview-header">Overview</h3>
          <p id="modal-desc">Movie description...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // movies available to client-side JS
    window.MOVIE_NAMES = {{ movie_names | default([]) | tojson }};
  </script>
  <script src="/static/script.js"></script>
</body>
</html>
